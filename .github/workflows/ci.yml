name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: los tests cargan la logica en TypeScript con --experimental-strip-types.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # El build no necesita credenciales: el cliente de Upstash se crea en la
      # primera peticion, no al importar el modulo.
      - name: Build
        run: npm run build
